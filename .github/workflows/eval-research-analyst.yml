name: Eval research-analyst

# Dois níveis:
# 1. offline: testa a régua (checks.py) e a fiação da suíte promptfoo com um
#    provider falso. Roda sempre, sem segredo nenhum.
# 2. modelos: roda a suíte de verdade contra os modelos. Só roda quando o
#    segredo ANTHROPIC_API_KEY existe no repositório.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'build/prompts/system/research-analyst.md'
      - 'build/evaluations/research-analyst/**'
      - 'tests/test_research_analyst_checks.py'
      - '.github/workflows/eval-research-analyst.yml'

permissions:
  contents: read

env:
  PROMPTFOO_VERSION: 0.125.1
  PROMPTFOO_DISABLE_TELEMETRY: '1'
  PROMPTFOO_DISABLE_UPDATE: '1'
  CONFIG: build/evaluations/research-analyst/promptfooconfig.yaml

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Testes da régua
        run: python -m unittest tests.test_research_analyst_checks -v
      - name: Fiação da suíte (provider falso)
        run: >
          npx -y promptfoo@${PROMPTFOO_VERSION} eval -c "$CONFIG"
          --providers file://offline_provider.py --grader file://offline_provider.py
          --no-cache --no-progress-bar --no-table

  modelos:
    runs-on: ubuntu-latest
    needs: offline
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        if: env.ANTHROPIC_API_KEY != ''
      - uses: actions/setup-python@v5
        if: env.ANTHROPIC_API_KEY != ''
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        if: env.ANTHROPIC_API_KEY != ''
        with: { node-version: '22' }
      - name: Eval nos modelos
        if: env.ANTHROPIC_API_KEY != ''
        run: npx -y promptfoo@${PROMPTFOO_VERSION} eval -c "$CONFIG" --no-cache --no-progress-bar -o results.json
      - uses: actions/upload-artifact@v4
        if: always() && env.ANTHROPIC_API_KEY != ''
        with:
          name: research-analyst-results
          path: results.json
      - name: Sem chave configurada
        if: env.ANTHROPIC_API_KEY == ''
        run: echo "Segredo ANTHROPIC_API_KEY não configurado; eval nos modelos pulado."
