name: Lab check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    name: offline-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Núcleo offline
        run: python scripts/check.py

  gate:
    name: lab-check
    if: always()
    needs: offline
    runs-on: ubuntu-latest
    steps:
      - name: Verificar resultado de todas as plataformas
        env:
          RESULT: ${{ needs.offline.result }}
        run: test "$RESULT" = success
