name: Validate front-matter

# Garante que todo artefato em learn/, build/, cases/ e ops/decisions/ tem
# front-matter válido conforme ops/TAGS.md. Roda o validador e os testes dele.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - '**/*.md'
      - 'scripts/validate_frontmatter.py'
      - 'tests/**'
      - '.github/workflows/validate-frontmatter.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testes do validador
        run: python -m unittest discover -s tests -v
      - name: Validar front-matter do repositório
        run: python scripts/validate_frontmatter.py
