name: Site

# Gera o site (MkDocs Material) a partir do conteúdo do repositório e publica
# no GitHub Pages: https://leozitogs.github.io/agentic-lab/

on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - 'mkdocs.yml'
      - 'site/**'
      - 'scripts/build_site.py'
      - '.github/workflows/site.yml'
  pull_request:
    paths:
      - '**/*.md'
      - 'mkdocs.yml'
      - 'site/**'
      - 'scripts/build_site.py'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NO_MKDOCS_2_WARNING: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar MkDocs
        run: python -m pip install -r site/requirements.txt
      - name: Preparar páginas
        run: python scripts/build_site.py
      - name: Gerar site
        run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
