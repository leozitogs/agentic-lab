          - ADR-0002 · Trilha avançada: ops/decisions/ADR-0002-trilha-avancada.md
          - ADR-0003 · Recuperação padrão para RAG: ops/decisions/ADR-0003-recuperacao-padrao-rag.md
          - ADR-0005 · Contribuição e governança: ops/decisions/ADR-0005-contribuicao-e-governanca.md
          - ADR-0004 · Mitigações padrão para agentes com ferramentas: ops/decisions/ADR-0004-mitigacoes-prompt-injection.md
