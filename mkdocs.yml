      - 02 · Ferramentas e saídas estruturadas: learn/avancado/02-ferramentas-e-saidas-estruturadas.md
      - 03 · RAG e recuperação: learn/avancado/03-rag-e-recuperacao.md
      - 04 · Memória e estado: learn/avancado/04-memoria-e-estado.md
      - 05 · Agentes de código: learn/avancado/05-agentes-de-codigo.md
      - 06 · Avaliação e red teaming: learn/avancado/06-avaliacao-e-red-teaming.md
      - 07 · Segurança de agentes: learn/avancado/07-seguranca-de-agentes.md
      - 08 · Observabilidade e LLMOps: learn/avancado/08-observabilidade-e-llmops.md
      - 09 · Modelos abertos: learn/avancado/09-modelos-abertos-e-otimizacao.md
