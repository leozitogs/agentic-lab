site_name: agentic-lab
site_description: Laboratório aberto de prática e engenharia de IA. Da arquitetura de prompts a agentes em produção.
site_url: https://leozitogs.github.io/agentic-lab/
repo_url: https://github.com/leozitogs/agentic-lab
repo_name: leozitogs/agentic-lab
edit_uri: ""
copyright: Apache License 2.0 · conteúdo do agentic-lab

# O conteúdo vive na raiz do repositório; scripts/build_site.py copia para cá.
docs_dir: _site_src
site_dir: _site

theme:
  name: material
  language: pt-BR
  font:
    text: Montserrat
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: { icon: material/weather-sunny, name: Tema claro }
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: { icon: material/weather-night, name: Tema escuro }
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
    - toc.follow

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search:
      lang: pt

validation:
  links:
    not_found: warn
    anchors: info
  omitted_files: info

nav:
  - Início:
      - README.md
      - Roadmap: ROADMAP.md
  - Participe:
      - Como contribuir: CONTRIBUTING.md
      - Matriz de contribuições e escuta: ops/MATRIZ-DE-CONTRIBUICOES.md
      - Guia completo: ops/CONTRIBUTING.md
      - Ambiente técnico: ops/DEVELOPMENT.md
      - Vivências: learn/notes/README.md
      - Template de experiência: learn/notes/EXPERIENCE-TEMPLATE.md
      - Governança: ops/GOVERNANCE.md
      - Operação do GitHub: ops/GITHUB.md
      - Código de conduta: CODE_OF_CONDUCT.md
      - Relatar vulnerabilidade: SECURITY.md
  - Fundamentos:
      - Visão geral: learn/roadmap/00-overview.md
      - Semana 1 · Fundamentos: learn/roadmap/01-fundamentos.md
      - Semana 2 · Arquitetura de prompts: learn/roadmap/02-arquitetura-de-prompts.md
      - Semana 3 · Avaliações: learn/roadmap/03-avaliacoes.md
      - Semana 4 · Skills: learn/roadmap/04-skills.md
      - Semana 5 · MCP fundamentos: learn/roadmap/05-mcp-fundamentos.md
      - Semana 6 · MCP aplicado: learn/roadmap/06-mcp-aplicado.md
      - Semana 7 · Segurança: learn/roadmap/07-seguranca.md
      - Semana 8 · Projeto integrador: learn/roadmap/08-projeto-integrador.md
  - Trilha avançada:
